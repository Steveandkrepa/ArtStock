# ============================================================================
#  ArtStock — GitHub Actions：云端构建「未签名 IPA」
#  ---------------------------------------------------------------------------
#  为什么需要它：
#    本机（iMac）没装 Xcode，只有一个 8 GB 内存的机器，
#    跑不动 Xcode / 模拟器。把构建放到 GitHub 的 macOS runner 上，
#    本地只需要浏览器和 git。
#
#  产物：一个完全未签名的 .ipa（无 _CodeSignature / 无 embedded.mobileprovision），
#       下载后 AirDrop 到 iPad，用 SideStore 重签安装。
#
#  ⚠️ 本工作流刻意**不做**任何签名、不配任何 Secret、不需要证书。
#     免费 Apple ID 签不出的 entitlement（iCloud / App Group / 推送 / HealthKit /
#     Background Modes / Associated Domains）本项目一律没用。
#
#  ⚠️ 关于 Xcode / SDK 版本：
#     源码里用到了 iOS 26 的 Liquid Glass API（glassEffect / GlassEffectContainer /
#     .buttonStyle(.glass) …），必须用 **iOS 26 SDK 或更新** 构建。
#     所以这里不写死 Xcode 版本，而是"自动挑 runner 上版本号最高的那个 Xcode"，
#     并且单独加一步**显式校验 iOS 26 SDK 是否存在**——不存在就明确失败，
#     而不是让编译在中途抛出一堆看不懂的 "cannot find glassEffect in scope"。
# ============================================================================

name: Build Unsigned IPA

# ------------------------------------------------------------------ 触发条件
on:
  # 手动触发：Actions 页面 → 本工作流 → Run workflow。
  # 可以指定 runner 与是否保留 dSYM。
  workflow_dispatch:
    inputs:
      runner:
        description: '运行构建的 macOS runner（需要能装 iOS 26 SDK 的镜像）'
        required: false
        default: 'macos-latest'
        type: string
      keep_dsym:
        description: '是否额外上传 dSYM（崩溃符号化用）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      require_ios26_sdk:
        description: '是否要求 iOS 26 SDK（true=没有就中止；false=警告并退化为材质外观）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

  push:
    # 推到 main 就出包，方便每次都拿到最新的可安装版本。
    branches:
      - main
    # 打 v* 标签（如 v1.0、v1.0.1）也出包，用于归档发布版本。
    tags:
      - 'v*'

# 同一分支/标签上重复触发时，取消上一次还在跑的构建，省额度。
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

# 只读权限即可：本工作流不写仓库、不发 Release。
permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: 构建未签名 IPA
    # 默认 macos-latest（GitHub 上最新的稳定 macOS 镜像）。
    # 手动触发时可以覆盖成别的镜像（例如某个明确带 Xcode 26 的版本）。
    # 刻意不写死具体版本：镜像里的 Xcode 会随 GitHub 更新，
    # 真正决定编译能不能过的是下面「自动挑选最新 Xcode」+「校验 iOS 26 SDK」两步。
    runs-on: ${{ github.event.inputs.runner || 'macos-latest' }}

    steps:
      # ---------------------------------------------------------------- 1
      - name: 检出代码
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- 2
      - name: 选择最新的 Xcode
        id: pick-xcode
        shell: bash
        run: |
          set -euo pipefail

          echo "== /Applications 下的 Xcode =="
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          # 版本号比较：a > b 返回 0，否则返回 1。
          # 手写而不用 sort -V —— macOS 自带的 BSD sort 不支持 -V。
          version_gt() {
            awk -v a="$1" -v b="$2" 'BEGIN{
              n = split(a, x, "."); m = split(b, y, ".");
              max = (n > m) ? n : m;
              for (i = 1; i <= max; i++) {
                xi = (i <= n) ? x[i] + 0 : 0;
                yi = (i <= m) ? y[i] + 0 : 0;
                if (xi > yi) exit 0;
                if (xi < yi) exit 1;
              }
              exit 1;
            }'
          }

          best_app=""
          best_ver="0.0"
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            ver="$(plutil -extract CFBundleShortVersionString raw -o - \
                    "$app/Contents/Info.plist" 2>/dev/null || echo "")"
            [ -n "$ver" ] || continue
            echo "  found: $app  ($ver)"
            if [ -z "$best_app" ] || version_gt "$ver" "$best_ver"; then
              best_app="$app"
              best_ver="$ver"
            fi
          done

          if [ -z "$best_app" ]; then
            echo "::error title=找不到 Xcode::这个 runner 镜像上没有 /Applications/Xcode*.app。"
            echo "  说明：只装了 Command Line Tools 的镜像无法构建 iOS App。"
            echo "  处理：把 runs-on 换成一个自带 Xcode 的 macOS 镜像（例如 macos-15 / macos-26）。"
            exit 1
          fi

          echo "选用 Xcode：$best_app ($best_ver)"
          sudo xcode-select -s "$best_app/Contents/Developer"
          echo "developer_dir=$best_app/Contents/Developer" >> "$GITHUB_OUTPUT"
          echo "xcode_version=$best_ver" >> "$GITHUB_OUTPUT"

          echo "== xcode-select -p =="
          xcode-select -p
          echo "== xcodebuild -version =="
          xcodebuild -version

      # ---------------------------------------------------------------- 3
      # 关于这里的取舍（很重要，别改成硬失败）：
      #
      # ArtStock/DesignSystem/LiquidGlass.swift 整块被 `#if compiler(>=6.2)` 包住。
      # 因此：
      #   · 工具链 >= 6.2（Xcode 26 及以上，自带 iOS 26 SDK）→ 编译并启用液态玻璃
      #   · 工具链 <  6.2（例如 Xcode 16 / iOS 18 SDK）→ **整块跳过，退化为
      #     .ultraThinMaterial 材质外观，编译照常成功**
      #
      # 也就是说"SDK 太旧"并不会导致构建失败，只会没有液态玻璃。
      # 所以这里默认只给出**警告**并继续构建 —— 保证你无论如何都能拿到可安装的 IPA，
      # 同时在日志、注解和 Step Summary 里把真实状态说清楚。
      # 如果你确实只要液态玻璃版本，手动触发时把 require_ios26_sdk 设为 true 即可。
      - name: 检查 iOS 26 SDK（决定是否启用液态玻璃）
        id: check-sdk
        shell: bash
        env:
          REQUIRE_IOS26: ${{ github.event_name == 'workflow_dispatch' && inputs.require_ios26_sdk || 'false' }}
        run: |
          set -euo pipefail

          echo "== xcodebuild -showsdks =="
          xcodebuild -showsdks || true

          sdk_ver="$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "")"
          echo "iphoneos SDK 版本：${sdk_ver:-<取不到>}"

          major="${sdk_ver%%.*}"
          glass="off"
          reason=""

          case "$major" in
            ''|*[!0-9]*)
              reason="xcrun --sdk iphoneos --show-sdk-version 没有返回有效版本号，通常是 xcode-select 没指向完整 Xcode。"
              ;;
            *)
              if [ "$major" -ge 26 ]; then
                glass="on"
              else
                reason="当前 iphoneos SDK 是 $sdk_ver（< 26），iOS 26 的 Liquid Glass API 不存在。"
              fi
              ;;
          esac

          if [ "$glass" = "on" ]; then
            echo "✅ iOS SDK $sdk_ver ≥ 26，将编译并启用 iOS 26 液态玻璃外观。"
          else
            echo "::warning title=本次构建不含液态玻璃::$reason"
            echo "  构建会继续。LiquidGlass.swift 里的 iOS 26 代码被 #if compiler(>=6.2) 整块跳过，"
            echo "  自动退化为 .ultraThinMaterial 材质外观，App 功能完全不受影响。"
            echo "  想要液态玻璃：换一个带 Xcode 26 的 runner 镜像（例如 macos-26）后重新构建。"

            if [ "$REQUIRE_IOS26" = "true" ]; then
              echo "::error title=require_ios26_sdk=true 且 SDK 不满足::已按你的要求中止构建。"
              exit 1
            fi
          fi

          echo "ios_sdk_version=${sdk_ver:-unknown}" >> "$GITHUB_OUTPUT"
          echo "liquid_glass=$glass" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------- 4
      - name: 安装 XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          # runner 镜像不一定预装 xcodegen，缺了就装。
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen || true
          fi
          # 装完再确认一次：brew 失败时要给出明确原因，而不是让后面
          # "command not found: xcodegen" 这种模糊报错来收场。
          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "::error title=xcodegen 安装失败::brew install xcodegen 没有成功。请检查 runner 的 Homebrew 是否可用。"
            exit 1
          fi
          xcodegen --version

      # ---------------------------------------------------------------- 5
      # 本机验证套件（不依赖 iOS SDK）：swiftc -parse 全部源码 +
      # 一致性/迁移检查 + 12 套 CLI 测试 + 资源/脚本静态检查。
      # 跑在 Xcode 环境里正好：Tests 只 import Foundation/CoreGraphics，
      # 用 runner 的 swiftc 编译即可；测试挂了就不出包。
      - name: 运行测试与静态检查（verify-all）
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/verify-all.sh
          ./scripts/verify-all.sh

      # ---------------------------------------------------------------- 6
      - name: 准备构建元信息（时间戳 / 短 SHA）
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u '+%Y%m%d-%H%M%S')"
          short_sha="$(git rev-parse --short HEAD)"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "ipa_name=ArtStock-unsigned-$stamp-$short_sha.ipa" >> "$GITHUB_OUTPUT"
          echo "artifact_name=ArtStock-unsigned-ipa-${stamp}-${short_sha}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------- 7
      - name: 构建未签名 IPA
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/make-unsigned-ipa.sh
          # 第 3 个参数是输出路径；脚本内部会把相对路径解析成绝对路径。
          ./scripts/make-unsigned-ipa.sh \
            ArtStock \
            Release \
            "$PWD/build/${{ steps.meta.outputs.ipa_name }}"

      # ---------------------------------------------------------------- 8
      - name: 收集构建日志（Xcode / SDK 版本快照）
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          {
            echo "== 触发信息 =="
            echo "ref        : ${{ github.ref }}"
            echo "sha        : ${{ github.sha }}"
            echo "runner     : ${{ runner.os }} / ${{ runner.arch }}"
            echo "镜像       : ${ImageOS:-n/a} ${ImageVersion:-n/a}"
            echo "时间(UTC)  : ${{ steps.meta.outputs.stamp }}"
            echo
            echo "== xcode-select -p =="
            xcode-select -p || true
            echo
            echo "== xcodebuild -version =="
            xcodebuild -version || true
            echo
            echo "== xcodebuild -showsdks =="
            xcodebuild -showsdks || true
            echo
            echo "== iphoneos SDK 版本 =="
            xcrun --sdk iphoneos --show-sdk-version || true
            echo
            echo "== swift --version =="
            swift --version || true
            echo
            echo "== xcodegen --version =="
            xcodegen --version || true
          } > build/logs/build-environment.txt 2>&1
          cat build/logs/build-environment.txt

      # ---------------------------------------------------------------- 9
      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          # artifact 名带时间戳与短 SHA，避免多次构建互相覆盖 / 分不清哪个是新的。
          name: ${{ steps.meta.outputs.artifact_name }}
          path: build/*.ipa
          # 找不到 ipa 说明构建其实没成功，直接失败，不要静默上传空包。
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------------- 10
      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}-logs
          path: build/logs/
          if-no-files-found: warn
          retention-days: 14

      # ---------------------------------------------------------------- 11
      # dSYM 用 xcodebuild 的默认输出位置。
      # 注意：这只是 artifact 的 glob，不影响脚本本身
      # （脚本仍然用 -showBuildSettings 动态定位产物，没有硬编码路径）。
      - name: 上传 dSYM（可选，用于崩溃符号化）
        # 括号不能省：&& 的优先级高于 ||，写错会让 push 触发的构建也依赖 inputs。
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.keep_dsym == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}-dsym
          path: build/DerivedData/Build/Products/*/*.dSYM
          # Release 构建理论上一定有 dSYM；万一没有也不要让整个工作流失败。
          if-no-files-found: warn
          retention-days: 14

      # ---------------------------------------------------------------- 12
      - name: 汇总结果
        if: always()
        shell: bash
        run: |
          {
            echo "## ArtStock 未签名 IPA 构建结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| Xcode | ${{ steps.pick-xcode.outputs.xcode_version }} |"
            echo "| iOS SDK | ${{ steps.check-sdk.outputs.ios_sdk_version }} |"
            echo "| 液态玻璃 | ${{ steps.check-sdk.outputs.liquid_glass == 'on' && '✅ 已启用（iOS 26 外观）' || '⚠️ 未启用（退化为材质外观，功能不受影响）' }} |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| artifact | \`${{ steps.meta.outputs.artifact_name }}\` |"
            echo "| 时间(UTC) | ${{ steps.meta.outputs.stamp }} |"
            echo ""
            echo "下载 artifact 里的 .ipa → AirDrop 到 iPad → 用 SideStore 打开安装。"
            echo ""
            echo "免费 Apple ID 限制：证书 7 天过期需续签；同时最多 3 个自签 App。"
            echo ""
            if [ "${{ steps.check-sdk.outputs.liquid_glass }}" != "on" ]; then
              echo "> **想要液态玻璃？** 本次 runner 上最高只有 iOS SDK ${{ steps.check-sdk.outputs.ios_sdk_version }}。"
              echo "> 手动触发本工作流时把 \`runner\` 填成带 Xcode 26 的镜像（例如 \`macos-26\`）重新构建即可。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
